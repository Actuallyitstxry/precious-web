<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PreciousT Collection — Team Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181310; --card:#211A16; --card-hi:#2b221c; --cream:#F3ECE2;
    --rose:#B98F73; --rose-light:#D8B79A; --wine:#5E2233; --wine-light:#7a2e45;
    --line:rgba(243,236,226,0.14); --danger:#C1553F; --ok:#7B9E6B;
    --font-serif:'Cormorant Garamond',serif; --font-sans:'Jost',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--cream); font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; min-height:100%;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3,.serif{font-family:var(--font-serif);}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button, input, select, textarea{font-family:inherit; color:inherit;}
  ::selection{background:var(--rose); color:var(--ink);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  .btn{
    font-family:var(--font-sans); font-weight:500; font-size:13.5px; letter-spacing:.02em;
    border-radius:8px; padding:11px 20px; cursor:pointer; border:1px solid transparent;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .2s ease, box-shadow .2s ease, background .2s, border-color .2s;
    white-space:nowrap;
  }
  .btn-primary{background:var(--rose); color:#221812;}
  .btn-primary:hover{background:var(--rose-light); transform:translateY(-1px);}
  .btn-ghost{background:transparent; color:var(--cream); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--rose-light); color:var(--rose-light);}
  .btn-danger{background:transparent; color:var(--danger); border-color:rgba(193,85,63,.4);}
  .btn-danger:hover{background:rgba(193,85,63,.12);}
  .btn-sm{padding:7px 13px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

  /* ===== LOGIN ===== */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px;
    background:radial-gradient(ellipse at 50% 0%, rgba(185,143,115,.14), transparent 60%);
  }
  .login-card{
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:40px 32px;
  }
  .login-card .eyebrow{letter-spacing:.3em; font-size:10.5px; text-transform:uppercase; color:var(--rose-light); margin-bottom:10px; text-align:center;}
  .login-card h1{font-size:26px; font-weight:500; text-align:center; margin-bottom:6px;}
  .login-card .sub{text-align:center; color:rgba(243,236,226,.55); font-size:13.5px; margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:rgba(243,236,226,.6); margin-bottom:6px; letter-spacing:.03em;}
  .field input, .field select{
    width:100%; padding:12px 14px; background:var(--ink); border:1px solid var(--line);
    border-radius:8px; font-size:14.5px; color:var(--cream); outline:none; transition:border-color .2s;
  }
  .field input:focus, .field select:focus{border-color:var(--rose);}
  .login-error{color:var(--danger); font-size:13px; margin-bottom:14px; text-align:center; min-height:0;}
  .login-card .btn{width:100%; margin-top:6px; padding:13px;}
  .login-hint{margin-top:22px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:rgba(243,236,226,.4); text-align:center; line-height:1.6;}

  /* ===== DASHBOARD ===== */
  .dash-header{
    position:sticky; top:0; z-index:50; background:rgba(24,19,16,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:16px 0; padding-top:calc(16px + env(safe-area-inset-top,0px));
  }
  .dash-header .row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--rose),var(--wine)); flex-shrink:0;}
  .brand .name{font-family:var(--font-serif); font-size:19px; font-weight:600;}
  .brand .name small{display:block; font-family:var(--font-sans); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:rgba(243,236,226,.45); font-weight:400;}
  .who{display:flex; align-items:center; gap:12px;}
  .role-pill{font-size:11px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); color:rgba(243,236,226,.6); letter-spacing:.04em; text-transform:uppercase;}
  .role-pill.agency{border-color:rgba(185,143,115,.4); color:var(--rose-light);}

  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin:28px 0 20px; flex-wrap:wrap;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .tab{
    font-size:13px; padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    color:rgba(243,236,226,.6); cursor:pointer; transition:all .2s;
  }
  .tab.active{background:var(--rose); border-color:var(--rose); color:#221812; font-weight:500;}
  .tab:hover:not(.active){border-color:var(--rose-light); color:var(--rose-light);}
  .search-box input{
    background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 16px;
    font-size:13px; color:var(--cream); outline:none; width:220px;
  }
  .search-box input:focus{border-color:var(--rose);}

  .stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .stat .num{font-family:var(--font-serif); font-size:26px; font-weight:600;}
  .stat .lbl{font-size:11.5px; color:rgba(243,236,226,.5); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; padding-bottom:60px;}
  .dcard{
    background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; transition:border-color .2s, transform .2s;
  }
  .dcard:hover{border-color:rgba(185,143,115,.35);}
  .dcard .thumb{height:210px; background:var(--card-hi) center/cover no-repeat; position:relative; display:flex; align-items:center; justify-content:center;}
  .dcard .thumb .ph{color:rgba(243,236,226,.25); font-size:12px;}
  .dcard .thumb .badge-out{
    position:absolute; top:10px; left:10px; background:var(--wine); color:var(--cream);
    font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:4px 9px; border-radius:999px;
  }
  .dcard .thumb .imgcount{
    position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,.55); color:#fff;
    font-size:10.5px; padding:3px 8px; border-radius:999px;
  }
  .dcard .body{padding:14px 16px; flex:1; display:flex; flex-direction:column; gap:6px;}
  .dcard .name{font-family:var(--font-serif); font-size:18px; font-weight:600; line-height:1.2;}
  .dcard .meta{font-size:12px; color:rgba(243,236,226,.5);}
  .dcard .sizes{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px;}
  .chip{font-size:10.5px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; color:rgba(243,236,226,.7);}
  .dcard .price{font-size:15px; color:var(--rose-light); font-weight:500; margin-top:4px;}
  .dcard .actions{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line);}
  .dcard .actions .btn{flex:1;}
  .empty-state{grid-column:1/-1; text-align:center; padding:80px 20px; color:rgba(243,236,226,.4);}

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,6,5,.7); backdrop-filter:blur(4px); z-index:200;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto;
  }
  .modal{
    width:100%; max-width:560px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:28px; margin-bottom:40px;
  }
  .modal h2{font-size:22px; margin-bottom:20px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .tag-input{display:flex; flex-wrap:wrap; gap:6px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--ink);}
  .tag-input .chip{display:flex; align-items:center; gap:6px; background:var(--card-hi); border-color:var(--line);}
  .tag-input .chip button{background:none; border:none; color:rgba(243,236,226,.5); cursor:pointer; font-size:13px; line-height:1;}
  .tag-input input{flex:1; min-width:60px; background:transparent; border:none; outline:none; font-size:13px; color:var(--cream); padding:4px;}
  .imglist{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .imgrow{display:flex; gap:8px; align-items:center;}
  .imgrow img{width:44px; height:44px; object-fit:cover; border-radius:6px; background:var(--ink); flex-shrink:0;}
  .imgrow input{flex:1;}
  .imgrow button{background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px; padding:4px 8px;}
  .bookingrow{display:flex; gap:8px; align-items:center;}
  .bookingrow input[type=date]{flex:1;}
  .bookingrow input[type=number]{width:70px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:18px; border-top:1px solid var(--line);}
  .add-row-btn{font-size:12.5px; color:var(--rose-light); background:none; border:1px dashed var(--line); border-radius:8px; padding:8px; cursor:pointer; text-align:center; margin-top:6px;}
  .add-row-btn:hover{border-color:var(--rose-light);}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:20px;}
  .panel h3{font-size:16px; margin-bottom:6px;}
  .panel p{font-size:13px; color:rgba(243,236,226,.55); line-height:1.6; margin-bottom:14px;}
  .panel .btnrow{display:flex; gap:10px; flex-wrap:wrap;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--card-hi); border:1px solid var(--line); color:var(--cream); padding:12px 20px;
    border-radius:999px; font-size:13px; z-index:400; transition:all .3s ease; pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--card-hi); border-radius:4px;}

  @media (max-width:600px){
    .row2{grid-template-columns:1fr;}
    .search-box input{width:150px;}
  }
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- boot data ---------- */
  var SEED = JSON.parse(document.getElementById('seed-data').textContent);
  var dresses = SEED.dresses || [];
  var users = SEED.users || {};
  var CATEGORIES = ["Signature Dresses","Premium Dresses","Standard Dresses"];

  function b64ToUtf8(b64){
    var bin = atob(b64.trim());
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  var currentUser = null; // {username, role, displayName}
  var view = { filter: 'All', search: '', editingId: null, isNew: false };

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3200);
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function uid(){ return 'd_' + Math.random().toString(36).slice(2,10); }

  function todayISO(){ return new Date().toISOString().slice(0,10); }

  function isCurrentlyOut(dress){
    if(!dress.bookings || !dress.bookings.length) return false;
    var today = new Date(); today.setHours(0,0,0,0);
    return dress.bookings.some(function(b){
      var start = new Date(b.start+'T00:00:00');
      var days = b.days || 4;
      var end = new Date(start); end.setDate(end.getDate()+days);
      return today >= start && today <= end;
    });
  }

  /* ---------- render root ---------- */
  function render(){
    if(!currentUser){ renderLogin(); }
    else{ renderDashboard(); }
  }

  /* ---------- LOGIN ---------- */
  function renderLogin(err){
    app.innerHTML =
      '<div class="login-screen"><div class="login-card">' +
        '<div class="eyebrow">PreciousT Collection</div>' +
        '<h1 class="serif">Catalogue Manager</h1>' +
        '<div class="sub">Sign in to manage the dress catalogue</div>' +
        (err ? '<div class="login-error">'+esc(err)+'</div>' : '<div class="login-error"></div>') +
        '<form id="login-form">' +
          '<div class="field"><label>Username</label><input type="text" id="lu" autocomplete="username" autocapitalize="off" required /></div>' +
          '<div class="field"><label>Password</label><input type="password" id="lp" autocomplete="current-password" required /></div>' +
          '<button type="submit" class="btn btn-primary">Sign in</button>' +
        '</form>' +
        '<div class="login-hint">This sign-in only controls what you can see on this page —<br>it does not use a secure server login system.</div>' +
      '</div></div>';

    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      var u = document.getElementById('lu').value.trim().toLowerCase();
      var p = document.getElementById('lp').value;
      var match = users[u];
      if(match && match.password === p){
        currentUser = { username: u, role: match.role, displayName: match.displayName || u };
        render();
      } else {
        renderLogin('Incorrect username or password.');
      }
    });
  }

  function logout(){ currentUser = null; view.editingId = null; render(); }

  /* ---------- DASHBOARD ---------- */
  function filteredDresses(){
    return dresses.filter(function(d){
      var matchCat = (view.filter==='All') || d.category===view.filter;
      var matchSearch = !view.search || (d.name||'').toLowerCase().indexOf(view.search.toLowerCase())>-1 || (d.colour||'').toLowerCase().indexOf(view.search.toLowerCase())>-1;
      return matchCat && matchSearch;
    });
  }

  function renderDashboard(){
    var list = filteredDresses();
    var counts = {};
    CATEGORIES.forEach(function(c){ counts[c] = dresses.filter(function(d){return d.category===c;}).length; });

    var html = '';
    html += '<div class="dash-header"><div class="wrap row">' +
      '<div class="brand"><div class="mark"></div><div class="name">PreciousT Collection<small>Catalogue Manager</small></div></div>' +
      '<div class="who"><span class="role-pill '+(currentUser.role==='agency'?'agency':'')+'">'+esc(currentUser.role==='agency' ? 'Agency Owner' : 'Client')+'</span>' +
        '<button class="btn btn-ghost btn-sm" id="logout-btn">Log out</button></div>' +
    '</div></div>';

    html += '<div class="wrap">';

    html += '<div class="stats-row">' +
      '<div class="stat"><div class="num">'+dresses.length+'</div><div class="lbl">Total dresses</div></div>' +
      CATEGORIES.map(function(c){ return '<div class="stat"><div class="num">'+counts[c]+'</div><div class="lbl">'+esc(c)+'</div></div>'; }).join('') +
    '</div>';

    if(currentUser.role==='agency'){
      html += '<div class="panel"><h3>Publish to the live website</h3>' +
        '<p>This page saves your edits in this browser only — it has no shared database. When you\'re done making changes, click below to download the updated site file, then upload it to your web host to replace the current one and make it live. Do this on the same device/browser where you made the edits.</p>' +
        '<div class="btnrow"><button class="btn btn-primary" id="export-btn">Download updated website file</button>' +
        '<button class="btn btn-ghost" id="accounts-btn">Manage login passwords</button></div>' +
      '</div>';
    }

    html += '<div class="toolbar">' +
      '<div class="tabs">' +
        ['All'].concat(CATEGORIES).map(function(c){
          return '<div class="tab '+(view.filter===c?'active':'')+'" data-filter="'+esc(c)+'">'+esc(c)+(c==='All'?'':' ('+counts[c]+')')+'</div>';
        }).join('') +
      '</div>' +
      '<div style="display:flex;gap:10px;align-items:center;">' +
        '<div class="search-box"><input type="text" id="search-inp" placeholder="Search dresses…" value="'+esc(view.search)+'"/></div>' +
        '<button class="btn btn-primary" id="add-dress-btn">+ Add dress</button>' +
      '</div>' +
    '</div>';

    html += '<div class="grid">';
    if(!list.length){
      html += '<div class="empty-state">No dresses match — try a different filter or add a new dress.</div>';
    } else {
      list.forEach(function(d){
        var img = (d.images && d.images[0]) || d.image || '';
        var out = isCurrentlyOut(d);
        html += '<div class="dcard" data-id="'+d.id+'">' +
          '<div class="thumb" style="'+(img?('background-image:url(\''+esc(img).replace(/'/g,"%27")+'\')'):'')+'">' +
            (!img ? '<span class="ph">No photo yet</span>' : '') +
            (out ? '<span class="badge-out">Currently out</span>' : '') +
            ((d.images&&d.images.length>1) ? '<span class="imgcount">'+d.images.length+' photos</span>' : '') +
          '</div>' +
          '<div class="body">' +
            '<div class="name">'+esc(d.name||'Untitled')+'</div>' +
            '<div class="meta">'+esc(d.category||'—')+' · '+esc(d.colour||'—')+'</div>' +
            '<div class="sizes">'+(d.sizes||[]).filter(Boolean).map(function(s){return '<span class="chip">'+esc(s)+'</span>';}).join('')+'</div>' +
            '<div class="price">R '+ (d.price!=null?Number(d.price).toLocaleString():'—') +'</div>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn btn-ghost btn-sm edit-btn" data-id="'+d.id+'">Edit</button>' +
            '<button class="btn btn-danger btn-sm delete-btn" data-id="'+d.id+'">Delete</button>' +
          '</div>' +
        '</div>';
      });
    }
    html += '</div></div>';

    app.innerHTML = html;

    document.getElementById('logout-btn').addEventListener('click', logout);
    document.getElementById('add-dress-btn').addEventListener('click', function(){ openDressModal(null); });
    document.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ view.filter = t.getAttribute('data-filter'); renderDashboard(); });
    });
    document.getElementById('search-inp').addEventListener('input', function(e){ view.search = e.target.value; renderDashboard(); });
    document.querySelectorAll('.edit-btn').forEach(function(b){
      b.addEventListener('click', function(){ openDressModal(dresses.find(function(d){return d.id===b.getAttribute('data-id');})); });
    });
    document.querySelectorAll('.delete-btn').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-id');
        var d = dresses.find(function(x){return x.id===id;});
        if(d && confirm('Remove "'+d.name+'" from the catalogue?')){
          dresses = dresses.filter(function(x){return x.id!==id;});
          renderDashboard();
          persist();
        }
      });
    });
    if(currentUser.role==='agency'){
      var exportBtn = document.getElementById('export-btn');
      if(exportBtn) exportBtn.addEventListener('click', exportSite);
      var acctBtn = document.getElementById('accounts-btn');
      if(acctBtn) acctBtn.addEventListener('click', openAccountsModal);
    }
  }

  /* ---------- DRESS MODAL ---------- */
  var draft = null;

  function openDressModal(dress){
    draft = dress ? JSON.parse(JSON.stringify(dress)) : {
      id: uid(), name:'', category: CATEGORIES[1], colour:'', price:'', sizes:[], images:[], bookings:[]
    };
    if(!draft.sizes) draft.sizes=[];
    if(!draft.images) draft.images=[];
    if(!draft.bookings) draft.bookings=[];
    view.isNew = !dress;
    renderModal();
  }

  function removeOverlayEl(){
    var ov = document.getElementById('modal-overlay');
    if(ov) ov.remove();
  }

  function closeModal(){
    removeOverlayEl();
    draft = null;
  }

  function renderModal(){
    removeOverlayEl();
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modal-overlay';

    var sizesHtml = draft.sizes.map(function(s,i){
      return '<span class="chip">'+esc(s)+'<button data-si="'+i+'" class="rm-size">×</button></span>';
    }).join('');

    var imagesHtml = draft.images.map(function(url,i){
      return '<div class="imgrow"><img src="'+esc(url)+'" onerror="this.style.opacity=0.15" /><input type="text" class="img-url" data-ii="'+i+'" value="'+esc(url)+'" placeholder="https://…"/><button class="rm-img" data-ii="'+i+'">✕</button></div>';
    }).join('');

    var bookingsHtml = draft.bookings.map(function(b,i){
      return '<div class="bookingrow"><input type="date" class="bk-start" data-bi="'+i+'" value="'+esc(b.start||'')+'"/>' +
        '<input type="number" class="bk-days" data-bi="'+i+'" min="1" max="14" placeholder="days" value="'+(b.days||'')+'"/>' +
        '<button class="rm-booking" data-bi="'+i+'">✕</button></div>';
    }).join('');

    overlay.innerHTML =
      '<div class="modal">' +
        '<h2 class="serif">'+(view.isNew?'Add a dress':'Edit dress')+'</h2>' +
        '<div class="field"><label>Dress name</label><input type="text" id="f-name" value="'+esc(draft.name)+'" /></div>' +
        '<div class="row2">' +
          '<div class="field"><label>Category</label><select id="f-category">'+CATEGORIES.map(function(c){return '<option value="'+esc(c)+'" '+(draft.category===c?'selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div>' +
          '<div class="field"><label>Colour</label><input type="text" id="f-colour" value="'+esc(draft.colour)+'" /></div>' +
        '</div>' +
        '<div class="field"><label>Price (R)</label><input type="number" id="f-price" value="'+esc(draft.price)+'" /></div>' +
        '<div class="field"><label>Sizes</label><div class="tag-input" id="sizes-wrap">'+sizesHtml+'<input type="text" id="size-inp" placeholder="Type a size, press Enter"/></div></div>' +
        '<div class="field"><label>Photos</label><div class="imglist" id="images-wrap">'+imagesHtml+'</div>' +
          '<button type="button" class="add-row-btn" id="add-img">+ Add photo link</button></div>' +
        '<div class="field"><label>Booking dates (dress is unavailable for a few days after each)</label><div class="imglist" id="bookings-wrap">'+bookingsHtml+'</div>' +
          '<button type="button" class="add-row-btn" id="add-booking">+ Add booking date</button></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="cancel-modal">Cancel</button>' +
          '<button class="btn btn-primary" id="save-dress">Save dress</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(overlay);

    document.getElementById('f-name').addEventListener('input', function(e){ draft.name = e.target.value; });
    document.getElementById('f-category').addEventListener('change', function(e){ draft.category = e.target.value; });
    document.getElementById('f-colour').addEventListener('input', function(e){ draft.colour = e.target.value; });
    document.getElementById('f-price').addEventListener('input', function(e){ draft.price = e.target.value; });

    overlay.addEventListener('mousedown', function(e){ if(e.target===overlay) closeModal(); });
    document.getElementById('cancel-modal').addEventListener('click', closeModal);

    document.getElementById('size-inp').addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var v = e.target.value.trim();
        if(v){ draft.sizes.push(v); renderModal(); }
      }
    });
    overlay.querySelectorAll('.rm-size').forEach(function(b){
      b.addEventListener('click', function(){ draft.sizes.splice(+b.getAttribute('data-si'),1); renderModal(); });
    });

    document.getElementById('add-img').addEventListener('click', function(){ draft.images.push(''); renderModal(); });
    overlay.querySelectorAll('.img-url').forEach(function(inp){
      inp.addEventListener('input', function(){ draft.images[+inp.getAttribute('data-ii')] = inp.value; });
    });
    overlay.querySelectorAll('.rm-img').forEach(function(b){
      b.addEventListener('click', function(){ draft.images.splice(+b.getAttribute('data-ii'),1); renderModal(); });
    });

    document.getElementById('add-booking').addEventListener('click', function(){ draft.bookings.push({start:todayISO(), days:4}); renderModal(); });
    overlay.querySelectorAll('.bk-start').forEach(function(inp){
      inp.addEventListener('input', function(){ draft.bookings[+inp.getAttribute('data-bi')].start = inp.value; });
    });
    overlay.querySelectorAll('.bk-days').forEach(function(inp){
      inp.addEventListener('input', function(){ draft.bookings[+inp.getAttribute('data-bi')].days = inp.value ? +inp.value : undefined; });
    });
    overlay.querySelectorAll('.rm-booking').forEach(function(b){
      b.addEventListener('click', function(){ draft.bookings.splice(+b.getAttribute('data-bi'),1); renderModal(); });
    });

    document.getElementById('save-dress').addEventListener('click', function(){
      draft.name = (draft.name || '').trim() || 'Untitled dress';
      draft.colour = (draft.colour || '').trim();
      draft.price = draft.price !== '' && draft.price != null ? Number(draft.price) : '';
      draft.images = draft.images.filter(function(u){ return u && u.trim(); });
      draft.bookings = draft.bookings.filter(function(b){ return b.start; });

      var idx = dresses.findIndex(function(d){ return d.id===draft.id; });
      if(idx>-1){ dresses[idx] = draft; } else { dresses.push(draft); }
      closeModal();
      renderDashboard();
      persist();
      showToast(view.isNew ? 'Dress added.' : 'Dress updated.');
    });
  }

  /* ---------- ACCOUNTS MODAL (agency only) ---------- */
  function openAccountsModal(){
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'accounts-overlay';
    var rows = Object.keys(users).map(function(u){
      var role = users[u].role;
      return '<div class="field"><label>'+esc(role==='agency'?'Agency owner':'Client')+' — username: '+esc(u)+'</label>' +
        '<input type="text" class="acct-pw" data-u="'+esc(u)+'" value="'+esc(users[u].password)+'" /></div>';
    }).join('');
    overlay.innerHTML = '<div class="modal"><h2 class="serif">Login passwords</h2>' +
      '<p style="font-size:12.5px;color:rgba(243,236,226,.55);margin-bottom:16px;line-height:1.6;">These are simple front-end passwords, not secure server accounts — anyone who can view this page\'s source code can see them. Don\'t reuse an important password here.</p>' +
      rows +
      '<div class="modal-actions"><button class="btn btn-ghost" id="cancel-accts">Close</button><button class="btn btn-primary" id="save-accts">Save</button></div>' +
    '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('mousedown', function(e){ if(e.target===overlay) overlay.remove(); });
    document.getElementById('cancel-accts').addEventListener('click', function(){ overlay.remove(); });
    document.getElementById('save-accts').addEventListener('click', function(){
      overlay.querySelectorAll('.acct-pw').forEach(function(inp){
        var u = inp.getAttribute('data-u');
        if(inp.value.trim()) users[u].password = inp.value.trim();
      });
      overlay.remove();
      persist();
      showToast('Passwords updated.');
    });
  }

  /* ---------- PERSIST ----------
     This page runs on your own hosting, with no backend/database.
     Edits are kept in THIS BROWSER (localStorage) while you work.
     To actually publish changes to the live site, use
     "Download updated website file" and re-upload it to your host. */
  function persist(){
    var newSeed = JSON.stringify({ dresses: dresses, users: users });
    try{
      localStorage.setItem('ptc_admin_state', newSeed);
    }catch(e){
      console.warn('local save failed', e);
      showToast('Could not save in this browser (storage may be disabled).');
    }
  }

  function loadLocalState(){
    try{
      var raw = localStorage.getItem('ptc_admin_state');
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.dresses)){
          dresses = parsed.dresses;
          users = parsed.users || users;
        }
      }
    }catch(e){}
  }

  /* ---------- EXPORT REAL SITE FILE ---------- */
  function exportSite(){
    try{
      var before = b64ToUtf8(document.getElementById('site-before-b64').textContent);
      var after = b64ToUtf8(document.getElementById('site-after-b64').textContent);
      var clean = dresses.map(function(d){
        var out = { name:d.name, category:d.category, colour:d.colour, sizes:(d.sizes||[]).filter(Boolean), price:Number(d.price)||0 };
        if(d.images && d.images.length){ out.images = d.images; } else if(d.image){ out.image = d.image; }
        if(d.bookings && d.bookings.length){ out.bookings = d.bookings.map(function(b){ var o={start:b.start}; if(b.days) o.days=Number(b.days); return o; }); }
        return out;
      });
      var arrText = 'const dresses = ' + JSON.stringify(clean, null, 2) + ';\n\n';
      var full = before + arrText + after;
      downloadFile('precioustcollections-index.html', full);
    }catch(e){
      console.error(e);
      showToast('Could not build the export file.');
    }
  }

  function downloadFile(filename, text){
    try{
      var blob = new Blob([text], {type:'text/html'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
      showToast('Download started.');
    }catch(e){ showToast('Download is not available in this browser.'); }
  }

  /* ---------- init ---------- */
  loadLocalState();
  render();
})();

</script>
</body>
</html>
